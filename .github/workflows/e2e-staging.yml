name: E2E staging

# Uprzywilejowane testy tylko ręcznie na zaufanym main.
# Właściciel musi skonfigurować environment security-staging: wymagany reviewer,
# dozwolona wyłącznie gałąź main i osobne sekrety STAGING_* (nigdy produkcja).
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run mutating tests against the isolated staging environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    if: github.ref == 'refs/heads/main' && inputs.run_e2e
    name: Playwright E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: security-staging
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests on dedicated staging
        env:
          CI: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          KSEF_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.STAGING_KSEF_CREDENTIALS_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY KSEF_CREDENTIALS_ENCRYPTION_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Dedicated staging configuration is incomplete."
              exit 1
            fi
          done
          pnpm test:e2e --shard=${{ matrix.shard }}/2
      # Trace i HTML mogą zawierać dane/sesje. Publikacja artefaktów wymaga
      # osobnego sprawdzenia redakcji; ten workflow ich nie wysyła.
